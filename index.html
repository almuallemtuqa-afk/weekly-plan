<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Plan System — BARAEM ALTAHTHEEB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --ink:#232C42;
  --ink-2:#2E3A57;
  --paper:#EFEDE1;
  --paper-2:#F7F5EC;
  --gold:#B6862F;
  --gold-2:#DDB35C;
  --forest:#3E5C4C;
  --forest-2:#e7efe9;
  --wax:#A63A2E;
  --wax-2:#f7e7e4;
  --line:#D9D3BE;
  --text:#232A3D;
  --text-soft:#6B6858;
  --radius:14px;
  --serif:'Fraunces', serif;
  --sans:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  font-family:var(--sans);
  color:var(--text);
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed; inset:0;
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 22px 22px;
  opacity:.35;
  pointer-events:none;
}
.wrap{max-width:920px; margin:0 auto; padding:18px 14px 60px;}

/* ---------- App header ---------- */
.app-header{
  display:flex; align-items:center; gap:14px;
  padding:14px 4px 18px;
}
.logo-header{ flex:none; height:50px; width:auto; }
.app-title h1{margin:0; font-size:18px; font-weight:700;}
.app-title p{margin:2px 0 0; font-size:12.5px; color:var(--text-soft);}

/* ---------- Role tabs ---------- */
.tabs{display:flex; gap:6px; padding:0 4px;}
.tab{
  flex:1; text-align:center; cursor:pointer; user-select:none;
  padding:11px 6px; font-weight:600; font-size:14px;
  background:var(--paper-2); color:var(--text-soft);
  border:1px solid var(--line); border-bottom:none;
  border-radius:10px 10px 0 0;
  transition:.15s;
}
.tab.active{background:var(--ink); color:var(--paper-2); border-color:var(--ink);}
.tab:hover:not(.active){color:var(--text);}

.panel{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:0 0 var(--radius) var(--radius);
  padding:18px;
}
@media(min-width:640px){ .panel{padding:26px;} }

/* ---------- Cards / sections ---------- */
.card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:16px;
}
.card h2{
  margin:0 0 14px; font-size:15px; font-weight:700; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.card h2 .num{
  font-family:var(--mono); font-size:11px; color:var(--gold); border:1px solid var(--gold-2);
  padding:1px 7px; border-radius:20px; background:#fbf3e3;
}
label{display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:5px; font-weight:600;}
input[type=text], input[type=date], textarea, select{
  width:100%; font-family:var(--sans); font-size:14px; color:var(--text);
  background:var(--paper-2); border:1px solid var(--line); border-radius:9px;
  padding:9px 11px; outline:none; transition:.15s;
}
input:focus, textarea:focus, select:focus{border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px #f3e6c8;}
textarea{resize:vertical; min-height:56px; line-height:1.5;}
.grid2{display:grid; grid-template-columns:1fr; gap:12px;}
@media(min-width:560px){ .grid2{grid-template-columns:1fr 1fr;} }
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}

.btn{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  font-family:var(--sans); font-weight:700; font-size:13.5px;
  padding:10px 18px; border-radius:9px; border:1px solid transparent;
  transition:.15s;
}
.btn-primary{background:var(--ink); color:#fff;}
.btn-primary:hover{background:var(--ink-2);}
.btn-gold{background:var(--gold); color:#fff;}
.btn-gold:hover{background:#a3781f;}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-danger{background:#fff; color:var(--wax); border-color:#e3bdb6;}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:7px;}
.btn-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; font-family:var(--mono);}
.pill-forest{background:var(--forest-2); color:var(--forest);}
.pill-wax{background:var(--wax-2); color:var(--wax);}
.pill-muted{background:#eee; color:#777;}
.pill-gold{background:#fbf1dc; color:#8a6414;}

.toggle-row{display:flex; gap:8px;}
.toggle-btn{flex:1; text-align:center; padding:10px; border-radius:9px; border:1px solid var(--line); background:var(--paper-2); font-weight:700; font-size:13.5px; cursor:pointer; color:var(--text-soft);}
.toggle-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.periods-check{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.pchk{position:relative;}
.pchk input{position:absolute; opacity:0; inset:0; cursor:pointer;}
.pchk span{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px;height:34px; border-radius:8px; border:1px solid var(--line);
  font-family:var(--mono); font-size:12.5px; font-weight:600; background:var(--paper-2); color:var(--text-soft);
}
.pchk input:checked + span{background:var(--wax); border-color:var(--wax); color:#fff;}

.imgbox{
  border:1.5px dashed var(--line); border-radius:11px; padding:12px; text-align:center; background:var(--paper-2);
}
.imgbox img{max-width:100%; max-height:160px; border-radius:8px; display:block; margin:0 auto 8px;}
.imgbox input[type=file]{font-size:12.5px;}

/* status table */
.stbl{width:100%; border-collapse:collapse; font-size:13px;}
.stbl th{font-size:11.5px; color:var(--text-soft); text-align:right; padding:6px 8px; border-bottom:1px solid var(--line);}
.stbl td{padding:8px; border-bottom:1px solid #f0eee2; vertical-align:middle;}
.stbl tr:last-child td{border-bottom:none;}
.progress{background:#eee; border-radius:20px; height:6px; width:100%; overflow:hidden;}
.progress i{display:block; height:100%; background:var(--gold);}

/* ---------- Teacher: day tab ---------- */
.day-tab{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--ink); color:var(--paper-2);
  padding:7px 16px 7px 22px; border-radius:0 999px 999px 0;
  font-size:13px; font-weight:700; margin-bottom:0;
}
.day-tab .badge{font-family:var(--mono); font-size:10.5px; background:var(--gold); color:#fff; padding:2px 8px; border-radius:20px;}
.day-block{margin-bottom:22px;}
.day-body{
  border:1px solid var(--line); border-top:none; border-radius:0 0 11px 11px;
  background:#fff; padding:12px;
}
.day-block .day-body{border-radius:0 11px 11px 11px;}

.period-row{
  display:grid; grid-template-columns:52px 1fr; gap:12px;
  padding:12px 0; border-bottom:1px dashed var(--line);
}
.period-row:last-child{border-bottom:none;}
.pnum{
  font-family:var(--mono); font-weight:700; font-size:12.5px; color:var(--ink);
  background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
  height:34px; display:flex; align-items:center; justify-content:center;
}
.locked-row{
  display:flex; align-items:center; gap:10px; background:var(--forest-2); color:var(--forest);
  border-radius:9px; padding:10px 12px; font-size:13px; font-weight:600;
}
.miss{background:var(--wax-2); border:1px solid #e3bdb6; color:var(--wax); border-radius:9px; padding:10px 12px; font-size:12.5px; margin-top:12px; line-height:1.7;}
.ok-banner{background:var(--forest-2); color:var(--forest); border-radius:9px; padding:10px 12px; font-size:13px; font-weight:700; margin-top:12px; display:flex; align-items:center; gap:8px;}

.vocab-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
.vocab-row input{flex:1;}
.icon-btn{
  flex:none; width:30px;height:30px; border-radius:7px; border:1px solid var(--line); background:var(--paper-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--text-soft);
}
.icon-btn:hover{border-color:var(--wax); color:var(--wax);}

.hint{font-size:12px; color:var(--text-soft); margin-top:4px; line-height:1.6;}

/* ---------- Parent plan ---------- */
.parent-empty{
  text-align:center; padding:60px 20px; color:var(--text-soft);
}
.parent-empty .em{font-size:34px; margin-bottom:10px;}
.plan-sheet{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.plan-head{
  background:var(--ink); color:var(--paper-2); padding:26px 20px; text-align:center;
}
.plan-head .mono{
  width:84px;height:84px;border-radius:50%; background:#fff; border:2px solid var(--gold);
  display:flex; align-items:center;justify-content:center; margin:0 auto 10px; padding:10px;
}
.plan-head .mono img{max-width:100%; max-height:100%; object-fit:contain;}
.plan-head h2{margin:0; font-size:14px; letter-spacing:.5px; font-weight:600; color:var(--gold-2);}
.plan-head h1{margin:4px 0 0; font-family:var(--serif); font-size:24px; font-weight:700;}

.plan-body{padding:16px;}
@media(min-width:640px){.plan-body{padding:24px;}}

.plan-infobar{
  display:flex; flex-wrap:wrap; background:var(--paper-2); border:1px solid var(--line);
  border-radius:10px; overflow:hidden; margin-bottom:18px;
}
.plan-infobar .item{
  flex:1; min-width:150px; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 10px; font-size:12.5px; font-weight:700; color:var(--ink);
  border-inline-end:1px solid var(--line);
}
.plan-infobar .item:last-child{border-inline-end:none;}
.plan-infobar .item b{font-family:var(--mono); color:var(--gold); font-weight:700;}
.plan-infobar .item .ic{font-size:15px;}

.ptable-wrap{overflow-x:auto; border-radius:10px;}
.ptable{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.ptable thead th{
  background:var(--ink); color:#fff; font-weight:700; padding:10px 8px; text-align:center; font-size:12px;
}
.ptable td{border-bottom:1px solid var(--line); border-inline-start:1px solid var(--line); padding:9px 8px; text-align:center; vertical-align:middle; background:#fff;}
.ptable td:last-child, .ptable th:last-child{border-inline-end:1px solid var(--line);}
.ptable tr.day-first td{border-top:3px solid var(--ink);}
.ptable td.pday{background:var(--paper-2); font-weight:700; color:var(--ink); line-height:1.7; white-space:nowrap;}
.ptable td.pday .dnum{display:block; font-family:var(--mono); font-size:11px; color:var(--gold); font-weight:600;}
.ptable td.pnum{font-family:var(--mono); font-weight:700; color:var(--text-soft);}
.ptable td.psubject{font-weight:700; color:var(--ink); white-space:nowrap;}
.ptable td.pcontent{text-align:start;}
.ptable td.phw{text-align:start; color:var(--text-soft);}
.ptable td.pevent{background:var(--forest-2); color:var(--forest); font-weight:700;}
.ptable td.pevent .ev-inner{display:flex; align-items:center; justify-content:center; gap:8px;}
.ptable td.pevent img{width:32px;height:32px;border-radius:6px;object-fit:cover;}

.p-section{margin-top:24px;}
.p-section > .stitle{font-family:var(--serif); font-weight:700; font-size:15px; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.p-section > .stitle::after{content:''; flex:1; height:1px; background:var(--line);}
.vocab-cols{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:640px){.vocab-cols{grid-template-columns:1fr 1fr 1fr;}}
.table-box{border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.vocab-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.vocab-table th{background:var(--ink); color:var(--paper-2); font-size:11.5px; padding:9px; text-align:center; font-family:var(--mono); font-weight:700;}
.vocab-table td{padding:8px 10px; font-size:13px; text-align:center; background:#fff; border-top:1px solid var(--line);}
.info-table{width:100%; border-collapse:collapse;}
.info-table th{background:var(--ink); color:var(--paper-2); font-size:11.5px; padding:9px 12px; text-align:center; font-family:var(--mono); font-weight:700;}
.info-table td{padding:12px 14px; font-size:13px; line-height:1.7; text-align:start; background:#fff;}
.two-col{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:560px){.two-col{grid-template-columns:1fr 1fr;}}
.two-col .box, .single-box{background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.7;}
.two-col .box h4, .single-box h4{margin:0 0 6px; font-size:12px; color:var(--ink); font-family:var(--mono);}
.announce img{width:100%; border-radius:11px; margin-top:8px;}
.av-table{width:100%; border-collapse:collapse; margin-top:8px; table-layout:fixed;}
.av-table th{background:var(--ink); color:var(--paper-2); font-size:12px; padding:10px; text-align:center;}
.av-table td{padding:14px 12px; text-align:center; font-size:13.5px; background:#fff; vertical-align:top; word-wrap:break-word;}

.chevron-strip{
  height:16px; margin-top:26px;
  background:
    linear-gradient(135deg, var(--ink) 25%, transparent 25%) 0 0/18px 18px repeat-x,
    linear-gradient(225deg, var(--ink) 25%, transparent 25%) 0 0/18px 18px repeat-x;
  opacity:.9;
}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:10px 20px; border-radius:30px; font-size:13px;
  opacity:0; pointer-events:none; transition:.25s; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,.2);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.small-note{font-size:11.5px; color:var(--text-soft); background:#fbf3e3; border:1px solid var(--gold-2); border-radius:9px; padding:9px 12px; margin-bottom:16px; line-height:1.7;}

@media print{
  body::before{display:none;}
  body{background:#fff;}
  .wrap{max-width:none; padding:0; margin:0;}
  .app-header, .tabs, .no-print, .toast, #parentClassSelect, label[for], .field label{display:none !important;}
  .field:has(#parentClassSelect){display:none !important;}
  .panel{border:none; border-radius:0; padding:0; background:#fff;}
  .plan-sheet{border:none; box-shadow:none;}
  .plan-head{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .ptable thead th, .vocab-table th, .info-table th, .av-table th{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .plan-body{padding:10px;}
  .p-section{page-break-inside:avoid;}
  .ptable-wrap{overflow:visible;}
}
</style>
</head>

  QURAAN:'Quran', LIBRARY:'Library', SOCIAL:'Social Studies'
};
function subjectLabel(code){ return SUBJECT_LABELS[code] || code; }
function subjectType(code){
  if(code==='ENGLISH') return 'english';
  if(code==='MATH') return 'math';
  if(code==='SCIENCE') return 'science';
  if(code==='ARABIC') return 'arabic';
  if(code==='ISLAMIC') return 'islamic';
  if(code==='ART') return 'art';
  return 'plain';
}
function isKG(classCode){ return classCode.startsWith('KG'); }
function classGroupLabel(code){ return isKG(code) ? 'Kindergarten' : 'Primary School'; }

/* ---- per-class derived data (cached) ---- */
const _slotsCache = {};
function classSubjectSlots(classCode){
  if(_slotsCache[classCode]) return _slotsCache[classCode];
  const timetable = ALL_CLASSES[classCode] || {};
  const slots = {};
  const order = [];
  DAYS.forEach(day=>{
    (timetable[day]||[]).forEach(({p,subject})=>{
      if(!slots[subject]){ slots[subject]=[]; order.push(subject); }
      slots[subject].push({day,p});
    });
  });
  const result = {slots, order};
  _slotsCache[classCode] = result;
  return result;
}
function classDayPeriods(classCode, day){ return (ALL_CLASSES[classCode]||{})[day] || []; }
function classDayCount(classCode, day){ return classDayPeriods(classCode, day).length; }
function classSubjectTeacher(classCode, subject){
  const timetable = ALL_CLASSES[classCode] || {};
  for(const day of DAYS){
    const found = (timetable[day]||[]).find(e=>e.subject===subject);
    if(found) return found.teacher;
  }
  return '';
}

/* ===================== STATE (one storage record per class) ===================== */
function makeSubjectState(classCode, code){
  const {slots} = classSubjectSlots(classCode);
  const entries={};
  (slots[code]||[]).forEach(({day,p})=>{ entries[day+'-'+p] = {content:'', homework:''}; });
  const type = subjectType(code);
  let extra = {};
  if(type==='english') extra = {readingStory:'', vocab:[]};
  else if(type==='math') extra = {vocab:[]};
  else if(type==='science') extra = {vocab:[]};
  else if(type==='arabic') extra = {note:''};
  else if(type==='islamic') extra = {note:''};
  else if(type==='art') extra = {requests:''};
  return {entries, extra, submitted:false};
}
function defaultState(classCode){
  const {order} = classSubjectSlots(classCode);
  const subjects={};
  order.forEach(code=> subjects[code]=makeSubjectState(classCode, code));
  return {
    meta:{week:'', dateFrom:'', dateTo:'', activity:'', value:'', starOfWeek:''},
    event:{has:false, name:'', day:'SUNDAY', scope:'full', periods:[], image:null},
    announcementImage:null,
    published:false,
    subjects
  };
}
function mergeDefaults(classCode, loaded){
  const def = defaultState(classCode);
  loaded.meta = Object.assign(def.meta, loaded.meta||{});
  loaded.event = Object.assign(def.event, loaded.event||{});
  if(loaded.announcementImage===undefined) loaded.announcementImage=null;
  if(loaded.published===undefined) loaded.published=false;
  loaded.subjects = loaded.subjects || {};
  Object.keys(def.subjects).forEach(code=>{
    if(!loaded.subjects[code]){ loaded.subjects[code]=def.subjects[code]; return; }
    loaded.subjects[code].entries = Object.assign(def.subjects[code].entries, loaded.subjects[code].entries||{});
    loaded.subjects[code].extra = Object.assign(def.subjects[code].extra, loaded.subjects[code].extra||{});
    if(loaded.subjects[code].submitted===undefined) loaded.subjects[code].submitted=false;
  });
  return loaded;
}

const API_URL = "https://script.google.com/macros/s/AKfycbwhZm8psvCo9bwCa8LrHOu2_cCHxXC-TVe9TspK6N2bl39Jf5ibXnhdhhTVGu-I1gmIRw/exec";

async function apiGet(key){
  const res = await fetch(API_URL + '?key=' + encodeURIComponent(key) + '&_ts=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('Network error');
  return res.json(); // { key, value }
}
async function apiSet(key, value){
  const res = await fetch(API_URL, {
    method: 'POST',
    cache: 'no-store',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
    body: JSON.stringify({ key, value })
  });
  if(!res.ok) throw new Error('Network error');
  return res.json();
}

function storageKey(classCode){ return 'plan:'+classCode; }

async function ensureClassLoaded(classCode){
  if(App.classStates[classCode]) return App.classStates[classCode];
  if(App.loadingClasses[classCode]) return App.loadingClasses[classCode];
  const p = (async ()=>{
    try{
      const res = await apiGet(storageKey(classCode));
      if(res && res.value){ App.classStates[classCode] = mergeDefaults(classCode, JSON.parse(res.value)); }
      else { App.classStates[classCode] = defaultState(classCode); }
    }catch(e){ App.classStates[classCode] = defaultState(classCode); }
    delete App.loadingClasses[classCode];
    render();
    return App.classStates[classCode];
  })();
  App.loadingClasses[classCode] = p;
  return p;
}

const _saveTimers = {};
function debouncedSaveClass(classCode){
  clearTimeout(_saveTimers[classCode]);
  _saveTimers[classCode] = setTimeout(()=>saveClassState(classCode), 500);
}
async function saveClassState(classCode){
  const state = App.classStates[classCode];
  if(!state) return;
  try{ await apiSet(storageKey(classCode), JSON.stringify(state)); }
  catch(e){ console.error(e); toast('Could not save — check your connection'); }
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2200);
}
function setPath(obj,path,val){ const p=path.split('.'); let o=obj; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }

function isLocked(state, classCode, day, p){
  const ev = state.event;
  if(!ev.has || ev.day!==day) return false;
  if(ev.scope==='full') return true;
  return ev.periods.includes(p);
}
function fullDayLocked(state, day){ const ev=state.event; return ev.has && ev.day===day && ev.scope==='full'; }

function resizeImage(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function classOptionsHtml(selected){
  const kgOpts = CLASS_ORDER.filter(c=>c.startsWith('KG')).map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');

  return `<optgroup label="Kindergarten">${kgOpts}</optgroup><optgroup label="Primary School">${gradeOpts}</optgroup>`;
}

function groupClassOptionsHtml(group, selected){

  </div>

  <div class="btn-row">
    <button class="btn btn-primary" data-action="save-setup">💾 Save Settings</button>
    ${s.published
      ? `<button class="btn btn-danger" data-action="toggle-publish">Unpublish</button>`
      : `<button class="btn btn-gold" data-action="toggle-publish">🚀 Approve &amp; Publish Plan</button>`}
    <button class="btn btn-ghost" data-action="preview-parent">👁️ Preview as Parent</button>
    <button class="btn btn-ghost" data-action="reset-demo" style="margin-inline-start:auto; color:#a15">↺ Reset this class's data</button>
  </div>
  ${s.published ? `<div class="ok-banner" style="margin-top:14px">🔗 The ${classCode} plan is now published.</div>` : ''}
  `;
}

function renderTeacher(){
  const classCode = App.ui.workClass;
  const state = App.classStates[classCode];
  if(!state){ ensureClassLoaded(classCode); return `<div class="parent-empty"><div class="em">⏳</div>Loading ${classCode} data...</div>`; }
  const {order} = classSubjectSlots(classCode);
  const code = order.includes(App.ui.teacherSubject) ? App.ui.teacherSubject : null;

  let html = `
  <div class="grid2" style="margin-bottom:20px">
    <div class="field"><label>Class</label><select id="workClassSelect">${classOptionsHtml(classCode)}</select></div>
    <div class="field"><label>Subject</label>
      <select id="teacherSubjectSelect">
        <option value="">— Select subject —</option>
        ${order.map(c=>`<option value="${c}" ${code===c?'selected':''}>${subjectLabel(c)} — ${classSubjectTeacher(classCode,c)}</option>`).join('')}
      </select>
    </div>
  </div>`;
  if(!code) return html + `<div class="parent-empty"><div class="em">📝</div>Select a class and subject above to see the periods from the real timetable.</div>`;

  const s = state;
  const st = s.subjects[code];
  const {slots} = classSubjectSlots(classCode);
  const missing = App.ui.missing[classCode+'|'+code] || [];

  let daysHtml = DAYS.filter(d=> slots[code].some(sl=>sl.day===d)).map(day=>{
    const daySlots = slots[code].filter(sl=>sl.day===day);
    const rows = daySlots.map(({p})=>{
      if(isLocked(s,classCode,day,p)){
        return `<div class="period-row"><div class="pnum">P${p}</div><div class="locked-row">🔒 ${esc(s.event.name||'Event')} — locked by Admin</div></div>`;
      }
      const e = st.entries[day+'-'+p];
      const dis = st.submitted ? 'disabled' : '';
      return `<div class="period-row">
        <div class="pnum">P${p}</div>
        <div>
          <label>Content</label>
          <textarea data-subject="${code}" data-day="${day}" data-period="${p}" data-kind="content" ${dis}>${esc(e.content)}</textarea>
          <label style="margin-top:8px">Homework</label>
          <textarea data-subject="${code}" data-day="${day}" data-period="${p}" data-kind="homework" ${dis}>${esc(e.homework)}</textarea>
        </div>
      </div>`;
    }).join('');
    return `<div class="day-block">
      <div class="day-tab">${DAY_LABEL[day]} <span class="badge">${daySlots.length} periods</span></div>
      <div class="day-body">${rows}</div>
    </div>`;
  }).join('');

  let extraHtml = '';
  const dis = st.submitted ? 'disabled' : '';
  const type = subjectType(code);
  if(type==='english'){
    extraHtml = `<div class="card"><h2>📖 Reading Story</h2>
      <textarea data-subject="${code}" data-extra="readingStory" ${dis}>${esc(st.extra.readingStory)}</textarea>
      </div>
      <div class="card"><h2>🔤 English Vocabulary</h2>${vocabEditor(classCode, code)}</div>`;
  } else if(type==='math'){
    extraHtml = `<div class="card"><h2>🔢 Math Vocabulary</h2>${vocabEditor(classCode, code)}</div>`;
  } else if(type==='science'){
    extraHtml = `<div class="card"><h2>🔬 Science Vocabulary</h2>${vocabEditor(classCode, code)}</div>`;
  } else if(type==='arabic'){
    extraHtml = `<div class="card"><h2>Arabic Notes</h2><textarea data-subject="${code}" data-extra="note" ${dis}>${esc(st.extra.note)}</textarea></div>`;
  } else if(type==='islamic'){
    extraHtml = `<div class="card"><h2>Islamic Studies Notes</h2><textarea data-subject="${code}" data-extra="note" ${dis}>${esc(st.extra.note)}</textarea></div>`;
  } else if(type==='art'){
    extraHtml = `<div class="card"><h2>Art Requests</h2><textarea data-subject="${code}" data-extra="requests" ${dis} placeholder="e.g. watercolors, cardboard...">${esc(st.extra.requests)}</textarea></div>`;
  }

  const missBox = missing.length ? `<div class="miss">⚠️ Please complete the following fields before submitting:<br>${missing.map(m=>'• '+m).join('<br>')}</div>` : '';
  const submitBar = st.submitted
    ? `<div class="ok-banner">✅ This subject's plan has been submitted</div><div class="btn-row"><button class="btn btn-ghost" data-action="reopen-subject" data-subject="${code}">Reopen for editing</button></div>`
    : `${missBox}<div class="btn-row"><button class="btn btn-gold" data-action="submit-subject" data-subject="${code}">📤 Submit Plan</button></div>`;

  return html + `<div class="small-note">You are now editing the <b>${subjectLabel(code)}</b> plan — ${classSubjectTeacher(classCode,code)} for class ${classCode}. Only your actual periods from the timetable are shown.</div>${daysHtml}${extraHtml}${submitBar}`;
}

function vocabEditor(classCode, code){
  const s = App.classStates[classCode];
  const st = s.subjects[code];
  const dis = st.submitted ? 'disabled' : '';
  const rows = st.extra.vocab.map((w,i)=>`
    <div class="vocab-row">
      <input type="text" data-subject="${code}" data-vocab-index="${i}" value="${esc(w)}" placeholder="word" ${dis}>
      ${!st.submitted ? `<button class="icon-btn" data-action="vocab-remove" data-subject="${code}" data-index="${i}">−</button>` : ''}
    </div>`).join('');
  return rows + (st.submitted ? '' : `<button class="btn btn-ghost btn-sm" data-action="vocab-add" data-subject="${code}">+ Add word</button>`) + `<div class="hint">No fixed number of words — add or remove as needed.</div>`;
}

function renderParent(){
  if(!App.ui.parentGroup){
    return `<div class="parent-empty" style="padding:50px 20px;">
      <div class="em">👋</div>
      <b>Please select your child's stage</b>
      <div class="btn-row" style="justify-content:center; margin-top:22px;">
        <button class="btn btn-gold" data-action="pick-group" data-group="KG" style="min-width:170px; padding:14px 22px; font-size:15px;">🧸 Kindergarten</button>
        <button class="btn btn-primary" data-action="pick-group" data-group="GRADE" style="min-width:170px; padding:14px 22px; font-size:15px;">🎒 Primary School</button>
      </div>
    </div>`;
  }
  const classCode = App.ui.parentClass;
  const changeStageBtn = `<button class="btn btn-ghost btn-sm no-print" data-action="change-stage" style="margin-bottom:10px">← Change stage</button>`;
  const selectorHtml = `${changeStageBtn}<div class="field no-print" style="margin-bottom:18px"><label>Select your child's class</label><select id="parentClassSelect">${groupClassOptionsHtml(App.ui.parentGroup, classCode)}</select></div>`;
  const state = App.classStates[classCode];
  if(!state){ ensureClassLoaded(classCode); return selectorHtml + `<div class="parent-empty"><div class="em">⏳</div>Loading the ${classCode} plan...</div>`; }
  const s = state;
  if(!s.published){
    return selectorHtml + `<div class="parent-empty"><div class="em">🕊️</div>This week's plan for class ${classCode} has not been published yet.<br><span class="hint">It will reach you via WhatsApp once approved by Admin.</span></div>`;
  }

  function dayDate(day){
    if(!s.meta.dateFrom) return '';
    try{
      const base = new Date(s.meta.dateFrom+'T00:00:00');
      const offset = DAYS.indexOf(day);
      const d = new Date(base.getTime() + offset*86400000);
      return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    }catch(e){ return ''; }
  }
  const dateRangeLabel = s.meta.dateFrom ? (dayDate('SUNDAY') + ' – ' + dayDate('THURSDAY')) : '—';

  function dayRows(day){
    if(fullDayLocked(s, day)){
      return [{event:true, pLabel:'All Day', span:classDayCount(classCode,day)}];
    }
    const list = classDayPeriods(classCode, day);
    const rows = [];
    let i = 0;
    while(i < list.length){
      const {p} = list[i];
      if(isLocked(s,classCode,day,p)){
        let j = i;
        while(j < list.length && isLocked(s,classCode,day, list[j].p)) j++;
        const startP = list[i].p, endP = list[j-1].p;
        rows.push({event:true, pLabel: startP===endP ? ('P'+startP) : ('P'+startP+'–P'+endP), span:1});
        i = j;
      } else {
        rows.push({event:false, p:list[i].p, subject:list[i].subject});
        i++;
      }
    }
    return rows;
  }

  const daysHtml = DAYS.map(day=>{
    const rows = dayRows(day);
    return rows.map((row, idx)=>{
      const firstCell = idx===0 ? `<td class="pday" rowspan="${rows.length}">${DAY_LABEL[day]}<span class="dnum">${dayDate(day)||classDayCount(classCode,day)+' periods'}</span></td>` : '';
      const trClass = idx===0 ? ' class="day-first"' : '';
      if(row.event){
        return `<tr${trClass}>${firstCell}<td class="pnum">${row.pLabel}</td><td class="pevent" colspan="3"><div class="ev-inner">${s.event.image?`<img src="${s.event.image}">`:'🎈'} ${esc(s.event.name||'School Event')}</div></td></tr>`;
      }
      const e = s.subjects[row.subject].entries[day+'-'+row.p];
      return `<tr${trClass}>${firstCell}<td class="pnum">P${row.p}</td><td class="psubject">${subjectLabel(row.subject)}</td><td class="pcontent">${esc(e.content)||'—'}</td><td class="phw">${esc(e.homework)||'—'}</td></tr>`;
    }).join('');
  }).join('');

  const readingStory = s.subjects.ENGLISH ? s.subjects.ENGLISH.extra.readingStory : '';
  const engVocab = s.subjects.ENGLISH ? s.subjects.ENGLISH.extra.vocab.filter(w=>w.trim()) : [];
  const mathVocab = s.subjects.MATH ? s.subjects.MATH.extra.vocab.filter(w=>w.trim()) : [];
  const sciVocab = s.subjects.SCIENCE ? s.subjects.SCIENCE.extra.vocab.filter(w=>w.trim()) : [];
  const arabicNote = s.subjects.ARABIC ? s.subjects.ARABIC.extra.note : '';
  const islamicNote = s.subjects.ISLAMIC ? s.subjects.ISLAMIC.extra.note : '';
  const artRequests = s.subjects.ART ? s.subjects.ART.extra.requests : '';

  const kg = isKG(classCode);
  const avTableHtml = kg
    ? `<table class="av-table">
         <thead><tr><th>Activity of the Week</th><th>Value of the Week</th><th>Star of the Week</th></tr></thead>
         <tbody><tr><td>${esc(s.meta.activity)||'—'}</td><td>${esc(s.meta.value)||'—'}</td><td>${esc(s.meta.starOfWeek)||'—'}</td></tr></tbody>
       </table>`
    : `<table class="av-table">
         <thead><tr><th>Activity of the Week</th><th>Value of the Week</th></tr></thead>
         <tbody><tr><td>${esc(s.meta.activity)||'—'}</td><td>${esc(s.meta.value)||'—'}</td></tr></tbody>
       </table>`;

  return selectorHtml + `<div class="btn-row no-print" style="margin-bottom:14px"><button class="btn btn-primary" data-action="print-plan">🖨️ Print / Save as PDF</button></div><div class="plan-sheet" id="printArea">
    <div class="plan-head">
      <div class="mono"><img src="${LOGO_DATA_URI}" alt="School logo"></div>
      <div>BARAEM ALTAHTHEEB INTERNATIONAL SCHOOL</div>
      <h1>WEEKLY PLAN</h1>
    </div>
    <div class="plan-body">
      <div class="plan-infobar">
        <div class="item"><span class="ic">📅</span> Grade: <b>${classCode}</b></div>
        <div class="item"><span class="ic">📅</span> Week: <b>${esc(s.meta.week)||'—'}</b></div>
        <div class="item"><span class="ic">📅</span> Date: <b>${dateRangeLabel}</b></div>
      </div>
      <div class="ptable-wrap">
        <table class="ptable">
          <thead><tr><th>Day</th><th>Period</th><th>Subject</th><th>Content</th><th>Homework</th></tr></thead>
          <tbody>${daysHtml}</tbody>
        </table>
      </div>

      ${readingStory && readingStory.trim() ? `<div class="p-section"><div class="table-box"><table class="info-table"><thead><tr><th>📖 READING STORY</th></tr></thead><tbody><tr><td>${esc(readingStory)}</td></tr></tbody></table></div></div>` : ''}

      <div class="p-section">
        <div class="stitle">🔤 Vocabulary</div>
        <div class="vocab-cols">
          <div class="table-box"><table class="vocab-table"><thead><tr><th>ENGLISH VOCABULARY</th></tr></thead><tbody>${engVocab.length?engVocab.map(w=>`<tr><td>${esc(w)}</td></tr>`).join(''):'<tr><td>—</td></tr>'}</tbody></table></div>
          <div class="table-box"><table class="vocab-table"><thead><tr><th>MATH VOCABULARY</th></tr></thead><tbody>${mathVocab.length?mathVocab.map(w=>`<tr><td>${esc(w)}</td></tr>`).join(''):'<tr><td>—</td></tr>'}</tbody></table></div>
          <div class="table-box"><table class="vocab-table"><thead><tr><th>SCIENCE VOCABULARY</th></tr></thead><tbody>${sciVocab.length?sciVocab.map(w=>`<tr><td>${esc(w)}</td></tr>`).join(''):'<tr><td>—</td></tr>'}</tbody></table></div>
        </div>
      </div>

      <div class="p-section">
        <div class="two-col">
          <div class="table-box"><table class="info-table"><thead><tr><th>ARABIC</th></tr></thead><tbody><tr><td>${esc(arabicNote)||'—'}</td></tr></tbody></table></div>
          <div class="table-box"><table class="info-table"><thead><tr><th>ISLAMIC STUDIES</th></tr></thead><tbody><tr><td>${esc(islamicNote)||'—'}</td></tr></tbody></table></div>
        </div>
      </div>

      <div class="p-section">
        <div class="table-box"><table class="info-table"><thead><tr><th>ART REQUESTS</th></tr></thead><tbody><tr><td>${esc(artRequests)||'—'}</td></tr></tbody></table></div>
      </div>

      ${s.announcementImage ? `<div class="p-section announce"><div class="stitle">📣 Announcement</div><img src="${s.announcementImage}"></div>` : ''}

      <div class="p-section">
        <div class="table-box">${avTableHtml}</div>
      </div>
      <div class="chevron-strip"></div>
    </div>
  </div>`;
}

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== EVENT DELEGATION ===================== */
const appEl = document.getElementById('app');
document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('[data-role-tab]'); if(!t) return;
  App.ui.role = t.dataset.roleTab;
  const cc = App.ui.role==='parent' ? App.ui.parentClass : App.ui.workClass;
  ensureClassLoaded(cc);
  render();
});

appEl.addEventListener('input', e=>{
  const t = e.target;
  const classCode = App.ui.role==='parent' ? App.ui.parentClass : App.ui.workClass;
  const state = App.classStates[classCode];
  if(!state) return;
  if(t.dataset.field){ setPath(state, t.dataset.field, t.value); debouncedSaveClass(classCode); return; }
  if(t.dataset.subject && t.dataset.day && t.dataset.period && t.dataset.kind){
    state.subjects[t.dataset.subject].entries[t.dataset.day+'-'+t.dataset.period][t.dataset.kind] = t.value;
    debouncedSaveClass(classCode); return;
  }
  if(t.dataset.subject && t.dataset.extra){
    state.subjects[t.dataset.subject].extra[t.dataset.extra] = t.value; debouncedSaveClass(classCode); return;
  }
  if(t.dataset.subject && t.dataset.vocabIndex!==undefined){
    state.subjects[t.dataset.subject].extra.vocab[+t.dataset.vocabIndex] = t.value; debouncedSaveClass(classCode); return;
  }
});

appEl.addEventListener('change', async e=>{
  const t = e.target;
  if(t.id==='workClassSelect'){
    App.ui.workClass = t.value;
    App.ui.teacherSubject = null;
    await ensureClassLoaded(t.value);
    render(); return;
  }
  if(t.id==='parentClassSelect'){
    App.ui.parentClass = t.value;
    await ensureClassLoaded(t.value);
    render(); return;
  }
  if(t.id==='teacherSubjectSelect'){ App.ui.teacherSubject = t.value || null; render(); return; }

  const classCode = App.ui.workClass;
  const state = App.classStates[classCode];
  if(!state) return;
  if(t.hasAttribute('data-event-day')){ state.event.day = t.value; state.event.periods=[]; render(); saveClassState(classCode); return; }
  if(t.hasAttribute('data-event-period')){
    const p = +t.dataset.eventPeriod;
    const arr = state.event.periods;
    const idx = arr.indexOf(p);
    if(t.checked && idx===-1) arr.push(p);
    if(!t.checked && idx!==-1) arr.splice(idx,1);
    saveClassState(classCode); return;
  }
  if(t.id==='eventImageInput' && t.files[0]){
    resizeImage(t.files[0], 700, dataUrl=>{ state.event.image = dataUrl; render(); saveClassState(classCode); });
    return;
  }
  if(t.id==='announcementImageInput' && t.files[0]){
    resizeImage(t.files[0], 900, dataUrl=>{ state.announcementImage = dataUrl; render(); saveClassState(classCode); });
    return;
  }
});

appEl.addEventListener('click', e=>{
  const classCode = App.ui.workClass;
  const state = App.classStates[classCode];

  const evHas = e.target.closest('[data-event-has]');
  if(evHas && state){ state.event.has = evHas.dataset.eventHas==='yes'; render(); saveClassState(classCode); return; }
  const evScope = e.target.closest('[data-event-scope]');
  if(evScope && state){ state.event.scope = evScope.dataset.eventScope; render(); saveClassState(classCode); return; }

  const btn = e.target.closest('[data-action]'); if(!btn) return;
  const action = btn.dataset.action;

  if(action==='save-setup'){ saveClassState(classCode); toast('Settings saved'); return; }
  if(action==='toggle-publish' && state){ state.published = !state.published; render(); saveClassState(classCode); toast(state.published?'Plan published':'Plan unpublished'); return; }
  if(action==='preview-parent'){ App.ui.role='parent'; App.ui.parentClass = classCode; App.ui.parentGroup = classCode.startsWith('KG') ? 'KG' : 'GRADE'; ensureClassLoaded(classCode); render(); return; }
  if(action==='pick-group'){
    const group = btn.dataset.group;
    App.ui.parentGroup = group;
    App.ui.parentClass = classesInGroup(group)[0];
    ensureClassLoaded(App.ui.parentClass);
    render();
    return;
  }
  if(action==='change-stage'){ App.ui.parentGroup = null; render(); return; }
  if(action==='print-plan'){ window.print(); return; }
  if(action==='reset-demo'){
    if(confirm('This will erase class '+classCode+'\'s data only and start over. Continue?')){
      App.classStates[classCode] = defaultState(classCode); render(); saveClassState(classCode); toast('Reset complete');
    }
    return;
  }
  if(action==='remove-event-image' && state){ state.event.image=null; render(); saveClassState(classCode); return; }
  if(action==='remove-announcement-image' && state){ state.announcementImage=null; render(); saveClassState(classCode); return; }

  if(action==='vocab-add' && state){ state.subjects[btn.dataset.subject].extra.vocab.push(''); render(); saveClassState(classCode); return; }
  if(action==='vocab-remove' && state){ state.subjects[btn.dataset.subject].extra.vocab.splice(+btn.dataset.index,1); render(); saveClassState(classCode); return; }

  if(action==='submit-subject' && state){
    const code = btn.dataset.subject;
    const st = state.subjects[code];
    const {slots} = classSubjectSlots(classCode);
    const missing = [];
    slots[code].forEach(({day,p})=>{
      if(isLocked(state,classCode,day,p)) return;
      const en = st.entries[day+'-'+p];
      if(!en.content.trim() || !en.homework.trim()) missing.push(DAY_LABEL[day]+' — P'+p);
    });
    if(subjectType(code)==='english' && !st.extra.readingStory.trim()) missing.push('Reading Story');
    const key = classCode+'|'+code;
    if(missing.length){ App.ui.missing[key]=missing; render(); return; }
    App.ui.missing[key]=[]; st.submitted = true; render(); saveClassState(classCode); toast('Plan submitted');
    return;
  }
  if(action==='reopen-subject' && state){ state.subjects[btn.dataset.subject].submitted = false; render(); saveClassState(classCode); return; }
});

/* ===================== INIT ===================== */
(async function init(){
  if(API_URL.indexOf('PASTE_YOUR_APPS_SCRIPT_URL_HERE') !== -1){
    document.getElementById('app').innerHTML = `<div class="parent-empty">
      <div class="em">⚙️</div>
      <b>Setup needed</b><br>
      <span class="hint">This page isn't connected to its free Google Sheets backend yet.<br>
      Open the HTML file, find the line starting with <code>const API_URL =</code> near the top of the script,<br>
      and replace the placeholder with your deployed Apps Script Web App URL.<br>
      See the setup steps at the top of apps-script-backend.gs.</span>
    </div>`;
    return;
  }
  const params = new URLSearchParams(window.location.search);
  if(params.get('parent') === '1'){
    App.ui.role = 'parent';
    App.ui.parentOnly = true;
    document.getElementById('tabs').style.display = 'none';
  } else if(params.get('teacher') === '1'){
    App.ui.role = 'teacher';
    document.getElementById('tabs').style.display = 'none';
  }
  const startClass = App.ui.role==='parent' ? App.ui.parentClass : App.ui.workClass;
  await ensureClassLoaded(startClass);
  render();
})();

</script>
